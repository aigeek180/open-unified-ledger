<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 756" width="960" height="756" role="img" aria-labelledby="t d">
<title id="t">Architecture of Open Unified Ledger</title>
<desc id="d">The Central Bank and Banks A, B and C each run a Besu validator and their own service. The shared ledger (Hyperledger Besu, QBFT, final at commit) holds the ParticipantRegistry, the WholesaleToken wCAD, a DepositToken per bank (dCAD-A, dCAD-B, dCAD-C), the ERC-3643 Bond and the SettlementEngine. Customers and the Issuer run no node; their bank signs for them. Inside each bank's service: an API with operators and approval policy, double-entry books in Postgres, a submitter and signer that send instructions to the ledger, a listener that posts entries at their block, a reconciler that proves the books equal the chain every block, and an ISO 20022 adapter. A Next.js console reads every service.</desc>
