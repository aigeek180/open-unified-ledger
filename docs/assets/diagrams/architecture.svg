<text x="276" y="592" font-size="13">Postgres, double entry,</text>
<text x="276" y="610" font-size="13">append-only; pending until</text>
<text x="276" y="628" font-size="13">the block posts it</text>
<rect x="274" y="654" width="188" height="64" rx="8" class="card"/>
<text x="286" y="674" font-size="13" font-weight="700">Reconciler</text>
<text x="286" y="692" font-size="13" class="muted">books = chain, every block;</text>
<text x="286" y="709" font-size="13" class="muted">breaks shown, never fixed</text>
<rect x="500" y="548" width="190" height="76" rx="10" class="card"/>
