<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" role="img" aria-labelledby="t d">
<title id="t">Bond delivery versus payment, cross-border payment versus payment, and repo</title>
<desc id="d">Bond DvP: Bank A delivers BOND-ISSUER-2031 units to Bank B and Bank B pays wCAD, in one instruction; Bank B co-signs only the trade its operator affirmed (its sese.023 receive instruction), both sides' sese.023 match on the UETR, and sese.025 confirms with the block. Cross-border PvP: Bank A's customer Northwind Freight pays Bank B's customer Mesa Solar in USD from CAD; four legs in one instruction (burn dCAD-A, wCAD Bank A to Bank C, wUSD Bank C to Bank B, mint dUSD-B), with wCAD and wUSD issued by two central banks, at a quote Bank C, the dealer, signed. Repo: Bank A lends wCAD to Bank B against bonds; open, margin, substitution and close are each one instruction.</desc>
