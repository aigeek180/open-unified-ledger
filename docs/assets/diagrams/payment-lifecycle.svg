<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 852" width="960" height="852" role="img" aria-labelledby="t d">
<title id="t">One interbank payment, step by step</title>
<desc id="d">1: an operator at Bank A orders Northwind Freight's payment of 2,500.00 to Lakeside Steel at Bank B; a UETR names it. 2: Bank A asks Bank B to co-sign the three legs. 3: Bank B rebuilds the legs itself, books its pending credit to Lakeside Steel and signs. 4: Bank A books its pending debit and an outbox row in one database transaction. 5: Bank A's submitter sends the instruction with Bank B's signature to the SettlementEngine. 6: block N burns dCAD-A, moves wCAD from Bank A to Bank B and mints dCAD-B, all or none, final at commit. 7: each participant's listener posts its entry at block N; the Central Bank posts the wCAD move between the banks' lines. 8: each reconciler proves its books equal the chain. The messages, all under the one UETR: pacs.008 and its pacs.009 cover, pacs.002 ACSC with the block, camt.054 to each customer's account.</desc>
