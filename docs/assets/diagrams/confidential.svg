<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 848" width="960" height="848" role="img" aria-labelledby="t d">
<title id="t">Confidential mode: who sees what</title>
<desc id="d">Each bank runs a Paladin node beside its validator and notarizes its deposit token as a Noto token. Northwind Freight's states live only on Bank A's node, Lakeside Steel's only on Bank B's; Bank C's node holds none of them. Bank A locks a burn, Bank B as notary locks a mint, both delegate their locks to ConfidentialSettlement, Bank B signs, and Bank A settles in one shared-ledger transaction that moves wCAD and spends both locks, or none. Validators see the wCAD leg in the clear, and for the deposits only state hashes and the notary's signature. A table compares what each participant could read in the baseline and in confidential mode, as pnpm confidential:compare measured it.</desc>
