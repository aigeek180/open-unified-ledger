<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" width="960" height="572" role="img" aria-labelledby="t d">
<title id="t">Today's interbank payment against the unified ledger</title>
<desc id="d">Left, today: Bank A sends a pacs.008 over a messaging network, the banks settle in central bank money in the RTGS, each bank posts its customer's account in its own books afterwards, and statements are reconciled at the end of the day. Right, the unified ledger: one instruction with three legs (burn dCAD-A from the payer, move wCAD from Bank A to Bank B, mint dCAD-B to the payee), signed by Bank A and co-signed by Bank B, settles in one final block, and every participant's books post from that block.</desc>
<style>
