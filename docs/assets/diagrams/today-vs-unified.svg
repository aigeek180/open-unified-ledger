.green-solid{fill:#1a7f37}
.green-line{stroke:#1a7f37;stroke-width:1.75;fill:none}
.green-dash{stroke:#1a7f37;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.green-stroke{fill:#1a7f37}
.green-edge{fill:none;stroke:#1a7f37;stroke-width:1.5}
.amber-box{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
.amber-soft{fill:#fff8c5}
.amber-ink{fill:#6c3b00}
.amber-solid{fill:#9a6700}
.amber-line{stroke:#9a6700;stroke-width:1.75;fill:none}
.amber-dash{stroke:#9a6700;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.amber-stroke{fill:#9a6700}
.amber-edge{fill:none;stroke:#9a6700;stroke-width:1.5}
.violet-box{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
.violet-soft{fill:#fbefff}
.violet-ink{fill:#512a97}
.violet-solid{fill:#8250df}
.violet-line{stroke:#8250df;stroke-width:1.75;fill:none}
.violet-dash{stroke:#8250df;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.violet-stroke{fill:#8250df}
.violet-edge{fill:none;stroke:#8250df;stroke-width:1.5}
.red-box{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}
.red-soft{fill:#ffebe9}
.red-ink{fill:#82071e}
.red-solid{fill:#cf222e}
.red-line{stroke:#cf222e;stroke-width:1.75;fill:none}
.red-dash{stroke:#cf222e;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.red-stroke{fill:#cf222e}
.red-edge{fill:none;stroke:#cf222e;stroke-width:1.5}
.slate-box{fill:#f6f8fa;stroke:#818b98;stroke-width:1.5}
.slate-soft{fill:#f6f8fa}
