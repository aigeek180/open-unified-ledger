.slate-solid{fill:#59636e}
.slate-line{stroke:#818b98;stroke-width:1.75;fill:none}
.slate-dash{stroke:#818b98;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.slate-stroke{fill:#818b98}
.slate-edge{fill:none;stroke:#818b98;stroke-width:1.5}
