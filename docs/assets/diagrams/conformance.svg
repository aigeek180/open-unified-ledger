<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 782" width="960" height="782" role="img" aria-labelledby="t d">
<title id="t">The conformance kit</title>
<desc id="d">Any settlement engine implements one adapter (reset, submit, observe, and optionally books and fault). The kit runs scripted flows with every fault and seeded random sequences, each on a fresh deployment, and judges nine checks drawn from the invariants: atomicity, exactly once, authority, eligibility, supply equals liability, liability conservation, books equal the ledger, FX consistency and repo collateral. A failing run is reported with its seed and shrunk to the smallest sequence that still fails. The sandbox's own engine passes every check; seven deliberately broken engines are each caught on the check named for them, and the HTLC and notary coordinators fail atomicity exactly where interop mode says.</desc>
