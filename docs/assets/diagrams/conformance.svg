<rect class="bg frame" x="0.5" y="0.5" width="959" height="781" rx="12"/>
<text x="24" y="36" font-size="22" font-weight="700">Checking any engine against the same invariants</text>
<text x="24" y="60" font-size="14" class="muted">One adapter, nine checks, and seven broken engines the kit must catch</text>
<rect x="24" y="84" width="176" height="132" rx="10" class="card"/>
<text x="38" y="108" font-size="15" font-weight="700">Engine under test</text>
<text x="38" y="132" font-size="13">the sandbox's own,</text>
<text x="38" y="151" font-size="13">or anyone else's</text>
<rect x="226" y="84" width="228" height="132" rx="10" class="violet-box"/>
<text x="240" y="108" font-size="15" class="violet-ink" font-weight="700">Adapter</text>
<text x="240" y="132" font-size="13" class="violet-ink mono">reset(scenario)</text>
<text x="240" y="151" font-size="13" class="violet-ink mono">submit(flow)</text>
<text x="240" y="170" font-size="13" class="violet-ink mono">observe(ledger, block)</text>
<text x="240" y="189" font-size="13" class="violet-ink mono">books(…)  fault(…)</text>
<rect x="480" y="84" width="210" height="132" rx="10" class="card"/>
<text x="494" y="108" font-size="15" font-weight="700">Runs</text>
<text x="494" y="132" font-size="13">scripted: every flow</text>
<text x="494" y="151" font-size="13">and every fault</text>
<text x="494" y="170" font-size="13">seeded random sequences,</text>
<text x="494" y="189" font-size="13">each on a fresh deployment</text>
<rect x="716" y="84" width="220" height="132" rx="10" class="card"/>
<text x="730" y="108" font-size="15" font-weight="700">Report</text>
<text x="730" y="132" font-size="13">pass or fail per check,</text>
<text x="730" y="151" font-size="13">with the seed; a failure</text>
<text x="730" y="170" font-size="13">shrunk to the smallest</text>
<text x="730" y="189" font-size="13">sequence that still fails</text>
<path d="M202 150 L223 150" class="slate-line" marker-end="url(#ah-slate)"/>
<path d="M456 150 L477 150" class="slate-line" marker-end="url(#ah-slate)"/>
<path d="M692 150 L713 150" class="slate-line" marker-end="url(#ah-slate)"/>
<text x="24" y="250" font-size="12" class="muted" font-weight="700">NINE CHECKS, FROM THE INVARIANTS</text>
<rect x="24" y="262" width="79.6004" height="26" rx="6" class="blue-box"/>
<text x="63.8002" y="279.68" font-size="13" class="blue-ink" text-anchor="middle" font-weight="600">atomicity</text>
<rect x="111.6" y="262" width="100.133" height="26" rx="6" class="blue-box"/>
<text x="161.667" y="279.68" font-size="13" class="blue-ink" text-anchor="middle" font-weight="600">exactly once</text>
<rect x="219.733" y="262" width="78.2224" height="26" rx="6" class="blue-box"/>
<text x="258.844" y="279.68" font-size="13" class="blue-ink" text-anchor="middle" font-weight="600">authority</text>
<rect x="305.955" y="262" width="80.1516" height="26" rx="6" class="blue-box"/>
<text x="346.031" y="279.68" font-size="13" class="blue-ink" text-anchor="middle" font-weight="600">eligibility</text>
<rect x="394.107" y="262" width="158.284" height="26" rx="6" class="blue-box"/>
<text x="473.249" y="279.68" font-size="13" class="blue-ink" text-anchor="middle" font-weight="600">supply equals liability</text>
<rect x="560.391" y="262" width="154.15" height="26" rx="6" class="blue-box"/>
<text x="637.466" y="279.68" font-size="13" class="blue-ink" text-anchor="middle" font-weight="600">liability conservation</text>
<rect x="722.541" y="262" width="163.658" height="26" rx="6" class="blue-box"/>
<text x="804.371" y="279.68" font-size="13" class="blue-ink" text-anchor="middle" font-weight="600">books equal the ledger</text>
<rect x="24" y="296" width="117.771" height="26" rx="6" class="blue-box"/>
<text x="82.8855" y="313.68" font-size="13" class="blue-ink" text-anchor="middle" font-weight="600">FX consistency</text>
<rect x="149.771" y="296" width="115.704" height="26" rx="6" class="blue-box"/>
<text x="207.623" y="313.68" font-size="13" class="blue-ink" text-anchor="middle" font-weight="600">repo collateral</text>
<text x="24" y="362" font-size="12" class="muted" font-weight="700">PROOF IT CATCHES FAILURES</text>
<text x="24" y="388" font-size="13" class="muted" font-weight="700">Engine</text>
<text x="232" y="388" font-size="13" class="muted" font-weight="700">The change</text>
<text x="640" y="388" font-size="13" class="muted" font-weight="700">Result</text>
<rect x="24" y="400" width="912" height="32" rx="8" class="green-box"/>
<text x="38" y="421" font-size="13" class="green-ink mono" font-weight="700">sandbox engine</text>
<text x="232" y="421" font-size="13">the real contracts and every participant's runtime</text>
<text x="640" y="421" font-size="13" class="green-ink" font-weight="700">passes all nine, with every fault</text>
<rect x="24" y="438" width="912" height="32" rx="8" class="card"/>
<text x="38" y="459" font-size="13" class="mono" font-weight="700">split-legs</text>
<text x="232" y="459" font-size="13">each leg settled in a transaction of its own</text>
<rect x="640" y="442" width="55.0875" height="24" rx="6" class="red-box"/>
<text x="667.544" y="458.5" font-size="12.5" class="red-ink" text-anchor="middle" font-weight="700">caught</text>
<text x="705.087" y="459" font-size="13"><tspan class="muted">by </tspan><tspan font-weight="600">atomicity</tspan></text>
<rect x="24" y="476" width="912" height="32" rx="8" class="card"/>
<text x="38" y="497" font-size="13" class="mono" font-weight="700">no-once</text>
<text x="232" y="497" font-size="13">no once-only check on the instruction id</text>
<rect x="640" y="480" width="55.0875" height="24" rx="6" class="red-box"/>
<text x="667.544" y="496.5" font-size="12.5" class="red-ink" text-anchor="middle" font-weight="700">caught</text>
<text x="705.087" y="497" font-size="13"><tspan class="muted">by </tspan><tspan font-weight="600">exactly once</tspan></text>
<rect x="24" y="514" width="912" height="32" rx="8" class="card"/>
<text x="38" y="535" font-size="13" class="mono" font-weight="700">lax-mint</text>
<text x="232" y="535" font-size="13">a mint accepted without the issuer's approval</text>
<rect x="640" y="518" width="55.0875" height="24" rx="6" class="red-box"/>
<text x="667.544" y="534.5" font-size="12.5" class="red-ink" text-anchor="middle" font-weight="700">caught</text>
<text x="705.087" y="535" font-size="13"><tspan class="muted">by </tspan><tspan font-weight="600">authority</tspan></text>
<rect x="24" y="552" width="912" height="32" rx="8" class="card"/>
<text x="38" y="573" font-size="13" class="mono" font-weight="700">open-deposit</text>
<text x="232" y="573" font-size="13">the deposit token admits anyone not blocked</text>
<rect x="640" y="556" width="55.0875" height="24" rx="6" class="red-box"/>
<text x="667.544" y="572.5" font-size="12.5" class="red-ink" text-anchor="middle" font-weight="700">caught</text>
<text x="705.087" y="573" font-size="13"><tspan class="muted">by </tspan><tspan font-weight="600">eligibility</tspan></text>
<rect x="24" y="590" width="912" height="32" rx="8" class="card"/>
<text x="38" y="611" font-size="13" class="mono" font-weight="700">book-refused</text>
<text x="232" y="611" font-size="13">a payment booked although the chain refused it</text>
<rect x="640" y="594" width="55.0875" height="24" rx="6" class="red-box"/>
<text x="667.544" y="610.5" font-size="12.5" class="red-ink" text-anchor="middle" font-weight="700">caught</text>
<text x="705.087" y="611" font-size="13"><tspan class="muted">by </tspan><tspan font-weight="600">books equal the ledger</tspan></text>
<rect x="24" y="628" width="912" height="32" rx="8" class="card"/>
<text x="38" y="649" font-size="13" class="mono" font-weight="700">round-fx-twice</text>
<text x="232" y="649" font-size="13">an FX leg rounded twice</text>
<rect x="640" y="632" width="55.0875" height="24" rx="6" class="red-box"/>
<text x="667.544" y="648.5" font-size="12.5" class="red-ink" text-anchor="middle" font-weight="700">caught</text>
<text x="705.087" y="649" font-size="13"><tspan class="muted">by </tspan><tspan font-weight="600">FX consistency</tspan></text>
<rect x="24" y="666" width="912" height="32" rx="8" class="card"/>
<text x="38" y="687" font-size="13" class="mono" font-weight="700">repo-interest-360</text>
<text x="232" y="687" font-size="13">a repo's interest over a 360-day year</text>
<rect x="640" y="670" width="55.0875" height="24" rx="6" class="red-box"/>
<text x="667.544" y="686.5" font-size="12.5" class="red-ink" text-anchor="middle" font-weight="700">caught</text>
<text x="705.087" y="687" font-size="13"><tspan class="muted">by </tspan><tspan font-weight="600">repo collateral</tspan></text>
<rect x="24" y="704" width="912" height="32" rx="8" class="card"/>
<text x="38" y="725" font-size="13" class="mono" font-weight="700">HTLC, notary 2PC</text>
<text x="232" y="725" font-size="13">interop mode's coordinators, across two ledgers</text>
<rect x="640" y="708" width="55.0875" height="24" rx="6" class="red-box"/>
<text x="667.544" y="724.5" font-size="12.5" class="red-ink" text-anchor="middle" font-weight="700">caught</text>
<text x="705.087" y="725" font-size="13"><tspan class="muted">by </tspan><tspan font-weight="600">atomicity *</tspan></text>
<text x="24" y="756" font-size="13" class="muted">* exactly in the cases where interop mode leaves the two ledgers disagreeing, and nowhere else.</text>
</svg>
