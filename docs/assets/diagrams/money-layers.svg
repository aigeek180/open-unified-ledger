<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="t d">
<title id="t">Who is liable for each token, and who may hold it</title>
<desc id="d">Three layers. wCAD is the Central Bank's liability (tokenized reserves), minted only by it and held only by banks with a reserve account: Bank A, Bank B, Bank C. dCAD-A is Bank A's deposit liability, still a deposit, minted and burned only by Bank A and held only by customers on its allowlist (Northwind Freight, Harbour Foods); dCAD-B and dCAD-C are alike. BOND-ISSUER-2031 is the Issuer's obligation, minted through its agent Bank C, held only by addresses with a verified identity under ERC-3643: banks, and Bank A's custody wallet for Alder Pension Plan and Birchline Insurance.</desc>
