<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 948" width="960" height="948" role="img" aria-labelledby="t d">
<title id="t">The same payment across two ledgers, under three coordinators</title>
<desc id="d">Interop mode puts Bank B's deposit token on a second Besu ledger. Ledger 1 holds the burn of the payer's dCAD-A and the wCAD move from Bank A to Bank B; ledger 2 holds the mint of the payee's dCAD-B. Each ledger runs a ConditionalSettlement that locks its part, then settles it or releases it. Unified settles all three legs in one transaction and never leaves the ledgers disagreeing. HTLC ends inconsistent when Bank B is back after ledger 1's timeout or its claim lands late: the payee was credited and Bank B never paid. Notary two-phase commit ends inconsistent when the notary crashes between its commits and is back after ledger 2's timeout, or its second commit lands late: Bank B was paid and the payee never credited. A table gives the outcome of each coordinator under each fault.</desc>
