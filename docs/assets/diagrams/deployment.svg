<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 766" width="960" height="766" role="img" aria-labelledby="t d">
<title id="t">What runs, and on which open projects</title>
<desc id="d">Each institution runs its own stack. The Central Bank and Banks A, B and C each run a participant service (Node 24, TypeScript, Fastify, viem) with a signer (a local key or AWS KMS), books in their own Postgres 17 schema with the reconciler, and a Hyperledger Besu 26.9.0 validator; each bank also runs a Paladin v1.0.0 node with Noto deposits for confidential mode. The four validators form the shared Besu QBFT ledger, which carries the SettlementEngine, ERC-7943 cash tokens and the project's own ERC-3643 bond, built on OpenZeppelin Contracts v5.7.0 and compiled with solc 0.8.37. Interop mode adds a second Besu network and a coordinator. Tooling: Docker Compose, Foundry, Anvil, vitest, the conformance kit, the Next.js 16 console and ISO 20022 XSD validation.</desc>
