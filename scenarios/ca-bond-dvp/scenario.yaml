# A bond issued, traded, paid and redeemed against tokenized wholesale CAD.
#
# Follows the pattern of the Bank of Canada's Project Samara (March 2026): a
# bond issued on a distributed ledger and settled in wholesale central bank
# deposits. The issuer settles through Bank C as issuing and paying
# agent. All participants and the bond are fictional.
id: ca-bond-dvp
name: Canadian bond delivery versus payment
currencies: [CAD]
timeZone: America/Toronto
# ISO 3166-1 numeric: Canada. Each bond holder's identity records it (ERC-3643).
country: 124

# An illustrative settlement calendar for the sandbox, not an official one.
calendar:
  weekend: [saturday, sunday]
  holidays:
    - 2026-11-11
    - 2026-12-25
    - 2026-12-28
    - 2027-01-01
    - 2027-03-26
    - 2027-05-24
    - 2027-07-01
    - 2027-09-06
    - 2027-09-30
    - 2027-10-11
    - 2027-11-11
    - 2027-12-27
    - 2027-12-28

participants:
  - { id: central-bank, name: Central Bank, kind: central-bank, currency: CAD, validator: true }
  - { id: bank-a, name: Bank A, kind: bank, reserves: [CAD], validator: true }
  - { id: bank-b, name: Bank B, kind: bank, reserves: [CAD], validator: true }
  - { id: bank-c, name: Bank C, kind: bank, reserves: [CAD], validator: true }
  - { id: issuer, name: Issuer, kind: issuer, agent: bank-c }

instruments:
  wholesale:
    - { symbol: wCAD, issuer: central-bank, currency: CAD }
  deposits:
    - { symbol: dCAD-A, issuer: bank-a, currency: CAD }
    - { symbol: dCAD-B, issuer: bank-b, currency: CAD }
    - { symbol: dCAD-C, issuer: bank-c, currency: CAD }
  bonds:
    - symbol: BOND-ISSUER-2031
      name: Issuer 3.25% bond due 2 November 2031
      issuer: issuer
      agent: bank-c
      face: "1000.00"
      units: 100000
      couponRate: "0.0325"
      frequency: semiannual
      dayCount: ACT/365F
      issueDate: 2026-11-02
      maturityDate: 2031-11-02
      recordDays: 1
      rounding: half-even

# Client custody (SPEC.md §15): Bank A holds the bond for two of its clients
# at an omnibus address, recording each client's position in its own books.
custody:
  - { bank: bank-a, clients: [alder-pension, birchline-insurance] }
